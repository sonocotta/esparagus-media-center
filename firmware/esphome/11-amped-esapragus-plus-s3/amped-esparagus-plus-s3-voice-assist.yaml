# ============================================================
# Amped-Esparagus-Plus-S3 - Voice-Assistant Configuration
# ============================================================
# ESP32-S3 audio board with PCM5122 DAC (I2S) and TPA3118 AMP
# Features: Wi-Fi media player with mixer/resampler, announcements,
#           RGB LED, IR receiver, rotary encoder, wake word / voice assist
# Board-specific pinouts defined in substitutions
# Functional blocks imported from /packages
# ============================================================

substitutions:
  name: esphome-web-e1b258
  friendly_name: Amped-Esparagus
  task_stack_in_psram: "true"

  # ===== Board-Specific Pinouts =====
  # I2S audio pins
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14
  i2s_dout_pin: GPIO16

  # I2S microphone pins
  i2s_mic_lrclk_pin: GPIO18
  i2s_mic_bclk_pin: GPIO17
  i2s_mic_din_pin: GPIO8
  i2s_mic_channel: right

  # I2C pins for DAC control
  i2c_sda_pin: GPIO42               # I2C pins are swapped on the rev H
  i2c_scl_pin: GPIO41               # These are correct for Rev H1 and later
  pcm5122_i2c_address: 0x4D         # I2C address of the DAC, it is 0x4C n the HiFi-ESP32 Rev H, and 0x4D on the rev H1+ and later
  pcm5122_dac_restore_mode: ALWAYS_ON  # DAC stays powered for instant voice-assist response, instead of enabling on-demand

  # Amp UNMUTE pin
  amp_enable_pin: GPIO4
  amp_enable_restore_mode: ALWAYS_ON

  # RGB LED
  rgb_led_pin: GPIO9
  num_leds: 8

  # IR Receiver
  ir_rx_pin: GPIO7

  # Rotary Encoder
  rotary_pin_a: GPIO47
  rotary_pin_b: GPIO21
  rotary_btn_pin: GPIO48

  # SPI pins (for display and ethernet)
  spi_clk_pin: GPIO12
  spi_mosi_pin: GPIO11
  spi_miso_pin: GPIO13

  # Display control pins
  display_cs_pin: GPIO39
  display_dc_pin: GPIO40
  display_reset_pin: GPIO38
  display_backlight_pin: GPIO1
  display_rotation: 0
  display_model: ILI9342

  # Ethernet pins (if using ethernet instead of wifi)
  eth_cs_pin: GPIO10
  eth_interrupt_pin: GPIO6
  eth_reset_pin: GPIO5

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.5.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio

esp32:
  id: esp32_id
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

      CONFIG_ESP32_S3_BOX_BOARD: "y"
      # OPTIMIZED WiFi buffers for streaming
      CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM: "16"
      CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM: "32"
      CONFIG_TCPIP_RECVMBOX_SIZE: "512"
      CONFIG_TCP_SND_BUF_DEFAULT: "65535"
      CONFIG_TCP_WND_DEFAULT: "512000"
      CONFIG_TCP_RECVMBOX_SIZE: "512"
      # Audio priority
      CONFIG_FREERTOS_UNICORE: "n"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

logger:
  level: INFO  # Changed from DEBUG to reduce overhead

api:

ota:
  platform: esphome
  password: !secret esphome_ota_password

wifi:
  ssid: !secret esphome_wifi_ssid
  password: !secret esphome_wifi_password

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

network:
  enable_ipv6: true

# ===== Packages =====
packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esparagus-media-center
    ref: main
    files:
      - firmware/esphome/packages/dac-pcm5122.yaml
      - firmware/esphome/packages/amp-switch.yaml

      - firmware/esphome/packages/audio.yaml
      - firmware/esphome/packages/media-player.yaml
      - firmware/esphome/packages/audio-addon-external-dac.yaml
      # - firmware/esphome/packages/media-player-addon-dac-enable.yaml  # DAC/amp left always-on instead (see *_restore_mode above), for instant voice-assist response
      # - firmware/esphome/packages/media-player-addon-amp-unmute.yaml

      - firmware/esphome/packages/light-x.yaml
      - firmware/esphome/packages/ir-receiver.yaml
      - firmware/esphome/packages/rotary-encoder.yaml

      - firmware/esphome/packages/monitoring.yaml
      - firmware/esphome/packages/monitoring-wifi.yaml
      # Optional ethernet (replace wifi config if you use this, you need to exclude OLED package if you do this to free up SPI bus)
      # - firmware/esphome/packages/ethernet-w5500.yaml
      # Optional display configuration for TFT SPI display
      # - firmware/esphome/packages/tft-spi.yaml

  esparagus_echo:
    url: https://github.com/sonocotta/esparagus-echo
    ref: main
    files:
      - firmware/esphome/packages/microphone-i2s.yaml
      - firmware/esphome/packages/microphone.yaml

      - firmware/esphome/packages/media-player-addon-voice-assist.yaml
      - firmware/esphome/packages/voice-assist.yaml

  # # Debug/local development fallback:
  # amp_switch: !include packages/amp-switch.yaml
  # audio: !include packages/audio.yaml
  # audio_external_dac: !include packages/audio-addon-external-dac.yaml
  # media_player: !include packages/media-player.yaml
  # light: !include packages/light-x.yaml
  # ir_receiver: !include packages/ir-receiver.yaml
  # rotary_encoder: !include packages/rotary-encoder.yaml
  # monitoring: !include packages/monitoring.yaml
  # monitoring_wifi: !include packages/monitoring-wifi.yaml
  # microphone_i2s: !include packages/microphone-i2s.yaml
  # microphone: !include packages/microphone.yaml
  # media_player_voice_assist: !include packages/media-player-addon-voice-assist.yaml
  # voice_assist: !include packages/voice-assist.yaml
  # # ethernet: !include packages/ethernet-w5500.yaml

  # dac-pcm5122.yaml isn't published to origin/main yet (added alongside
  # this board), so it can't be pulled through the esparagus_remote block
  # above - included locally for now, same as the sibling *-sendspin.yaml.
