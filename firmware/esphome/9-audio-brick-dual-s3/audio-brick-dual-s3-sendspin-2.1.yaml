# ============================================================
# Audio-Brick-Dual-S3 - Media Player Configuration
# ============================================================
# ESP32 audio board with 2x TAS5825M DAC (I2C+I2S) with built-in DSP
# ============================================================

substitutions:
  name: esphome-web-c8f04c
  friendly_name: Audio-Brick-Dual-S3
  task_stack_in_psram: "true" 

  # ===== Board-Specific Pinouts =====
  # I2S audio pins
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14
  i2s_dout_pin: GPIO16

  # TAS5825M MAIN DAC
  tas58xx_variant: TAS5825M
  tas58xx_enable_pin: GPIO18
  i2c_sda_pin: GPIO8
  i2c_scl_pin: GPIO9

  # TAS5825M SECONDARY DAC
  tas58xx_enable_pin_secondary: GPIO17

  # ===== DAC Overrides (optional) =====
  # tas58xx_dac_mode: PBTL 
  # tas58xx_mixer_mode: MONO
  # tas58xx_analog_gain: 0db
  # tas58xx_volume_max: 0dB
  # tas58xx_volume_min: -60dB
  
  # RGB LED
  rgb_led_pin: GPIO21

  # SPI pins (for display and ethernet)
  spi_clk_pin: GPIO12
  spi_mosi_pin: GPIO11
  spi_miso_pin: GPIO13
  
  # Display control pins
  display_cs_pin: GPIO47
  display_dc_pin: GPIO38
  display_reset_pin: GPIO48
  display_backlight_pin: GPIO2
  display_model: ILI9341

  # Ethernet (W5500) - identical pinout to Audio Brick S3
  eth_cs_pin: GPIO10
  eth_interrupt_pin: GPIO6
  eth_reset_pin: GPIO5

  # Fan pins
  fan_input_pin: GPIO7
  fan_pwn_pin: GPIO4 


esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio

esp32:
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y" 

logger:
  level: DEBUG

api:

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

network:
  enable_ipv6: true
  # Both `wifi:` and `ethernet:` are configured in this file. On the ESP32 family the two
  # stacks can run side by side, but then the priority list is mandatory (ESPHome 2026.8.1+).
  # It decides which interface is brought up first, whose IP is reported, and which one
  # carries the default route. Failover is automatic: unplug the cable and traffic moves
  # to Wi-Fi, plug it back in and Ethernet takes over again.
  priority:
    - ethernet
    - wifi

# ===== Packages =====
packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esparagus-media-center
    ref: main
    files:
      # A: 2.1 configuration with secondary DAC (PBTL) and main DAC (BTL)
      - firmware/esphome/packages/dac-tas58xx-dual-2.1.yaml
      # B: 4.0 configuration with 4-full size speakers
      # - firmware/esphome/packages/dac-tas58xx-dual-4.0.yaml
      
      - firmware/esphome/packages/audio.yaml
      - firmware/esphome/packages/audio-addon-external-dac.yaml

      - firmware/esphome/packages/sendspin.yaml
      - firmware/esphome/packages/sendspin-addon-tas58xx.yaml
      - firmware/esphome/packages/media-player-addon-dac-enable-dual.yaml
      - firmware/esphome/packages/media-player-addon-volume-sync-dual.yaml
      # Optional addon to adjust subwoofer gain based on the main volume slider - loudness effect
      # - firmware/esphome/packages/media-player-addon-dynamic-gain-dual.yaml

      # Optional display for a TFT SPI screen (ESPHome 2026.9.0+). Not together with
      # ethernet-w5500.yaml: they share the SPI pins. Playback screen plus one idle screen:
      # - firmware/esphome/packages/sendspin-display.yaml
      # Option A: clock only
      # - firmware/esphome/packages/sendspin-display-clock.yaml
      # Option B: clock, weather and 4-day forecast (needs weather sensors in Home
      # Assistant, see weather-sensors.yaml); replaces Option A
      # - firmware/esphome/packages/weather-sensors.yaml
      # - firmware/esphome/packages/sendspin-display-weather.yaml

      # - firmware/esphome/packages/fan.yaml <- only if you have it installed
      - firmware/esphome/packages/light.yaml
      - firmware/esphome/packages/monitoring.yaml
      - firmware/esphome/packages/monitoring-wifi.yaml
      - firmware/esphome/packages/monitoring-eth.yaml
      # Ethernet (W5500), running alongside `wifi:` via the network priority list above.
      # Shares the SPI pins with the TFT display, so the display package must stay excluded.
      - firmware/esphome/packages/ethernet-w5500.yaml
