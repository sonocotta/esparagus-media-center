# ============================================================
# Amped-Esparagus (rev M) - Snapclient Configuration
# ============================================================
# ESP32 audio board with PCM5100 DAC (I2S) and TPA3118 AMP (rev M)
# Configured as a Snapcast client for synchronized audio
# There are two implementations available:
# 1) Basic snapclient without DSP controls (c-MM original port)
# 2) snapclient with added DSP controls (farmed-switch fork of c-MM port)
#     Frequencies: 40, 50, 60, 70, 80, 90, 100, 110, 120, 130,
#                 140, 200, 315, 500, 800, 1250, 2000, 5000 Hz
#     Range: -15dB to +15dB per band
# Board-specific pinouts defined in substitutions
# Functional blocks imported from /packages
# ============================================================

substitutions:
  name: esphome-web-db7ea8
  friendly_name: Amped-Esparagus
  task_stack_in_psram: "false"

  # ===== Board-Specific Pinouts =====
  # I2S Audio (PCM5100 DAC)
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26
  i2s_dout_pin: GPIO22
  dac_enable_pin: GPIO13
  dac_enable_restore_mode: ALWAYS_OFF

  # RGB LED
  rgb_led_pin: GPIO12
  num_leds: 8

  # IR Receiver
  ir_rx_pin: GPIO39

  # Rotary Encoder
  rotary_pin_a: GPIO33
  rotary_pin_b: GPIO27
  rotary_btn_pin: GPIO34

  # SPI pins (for display and ethernet)
  spi_clk_pin: GPIO18
  spi_mosi_pin: GPIO23
  spi_miso_pin: GPIO19

  # Ethernet (W5500)
  eth_cs_pin: GPIO05
  eth_interrupt_pin: GPIO35
  eth_reset_pin: GPIO14

  # TFT (SPI)
  display_cs_pin: GPIO15
  display_dc_pin: GPIO04
  display_reset_pin: GPIO32
  display_backlight_pin: GPIO21
  display_rotation: 0
  display_model: ILI9342

  # ===== Snapcast Server Configuration =====
  snapcast_server_ip: "192.168.1.48"
  snapcast_server_port: "1704"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.5.0
  platformio_options:
    board_build.flash_mode: dio

esp32:
  id: esp32_id
  variant: esp32
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: 5.5.4 # recommended
    advanced:
      minimum_chip_revision: "3.1"
    sdkconfig_options:
      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

logger:
  level: DEBUG

api:

ota:
  platform: esphome
  password: !secret esphome_ota_password

wifi:
  ssid: !secret esphome_wifi_ssid
  password: !secret esphome_wifi_password

psram:
  speed: 80MHz

network:
  enable_ipv6: true

# ===== Packages =====
packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esparagus-media-center
    ref: main
    files:
      - firmware/esphome/packages/light-x.yaml
      - firmware/esphome/packages/ir-receiver.yaml
      - firmware/esphome/packages/monitoring.yaml
      - firmware/esphome/packages/monitoring-wifi.yaml
      - firmware/esphome/packages/rotary-encoder.yaml
      - firmware/esphome/packages/dac-switch.yaml
      # Option A: @c-MM original port of esp32-snapclient client
      # Basic implementation without DSP controls
      - firmware/esphome/packages/snapclient-new.yaml
      - firmware/esphome/packages/snapclient-addon-dac-enable.yaml
      # Option B: @farmed-switch fork of the c-MM snapclient with added DSP controls
      # Implements software BQ-filters for basic DACs and controls hardware DSP for DSP-enabled DACs like TAS5805M
      # - firmware/esphome/packages/snapclient-with-dsp.yaml

      # Optional Ethernet (replace wifi config if you use this, you need to exclude the TFT package if you do this to free up SPI bus)
      # - firmware/esphome/packages/ethernet-w5500.yaml
      # Optional display configuration for TFT SPI display
      # - firmware/esphome/packages/tft-spi.yaml
