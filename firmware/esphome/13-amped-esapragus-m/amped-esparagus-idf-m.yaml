# ============================================================
# Amped-Esparagus (rev M) - Media Player Configuration
# ============================================================
# ESP32 audio board with PCM5100 DAC (I2S) and TPA3118 AMP (rev M)
# Features: Wi-Fi media player with mixer/resampler,
#           announcements, RGB LED, IR receiver, rotary encoder,
#           optional Ethernet and SPI TFT display
# Board-specific pinouts defined in substitutions
# Functional blocks imported from /packages
# ============================================================

substitutions:
  # Override in your own config with: ota_password: !secret ota_password
  ota_password: ""
  name: amped-esparagus-m
  friendly_name: Amped-Esparagus
  task_stack_in_psram: "false"

  # ===== Board-Specific Pinouts =====
  # I2S Audio (PCM5100 DAC)
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26
  i2s_dout_pin: GPIO22

  # AMP Enable Pin
  dac_enable_pin: GPIO13
  dac_enable_restore_mode: ALWAYS_OFF

  # RGB LED
  rgb_led_pin: GPIO12
  num_leds: 8

  # IR Receiver
  ir_rx_pin: GPIO39

  # Rotary Encoder
  rotary_pin_a: GPIO33
  rotary_pin_b: GPIO27
  rotary_btn_pin: GPIO34

  # SPI pins (for display and ethernet)
  spi_clk_pin: GPIO18
  spi_mosi_pin: GPIO23
  spi_miso_pin: GPIO19

  # Ethernet (W5500)
  eth_cs_pin: GPIO05
  eth_interrupt_pin: GPIO35
  eth_reset_pin: GPIO14

  # TFT (SPI)
  display_cs_pin: GPIO15
  display_dc_pin: GPIO04
  display_reset_pin: GPIO32
  display_backlight_pin: GPIO21
  display_rotation: 0
  display_model: ILI9342

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0

esp32:
  id: esp32_id
  variant: esp32
  flash_size: 8MB
  flash_mode: dio
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: 5.5.4 # recommended
    advanced:
      # Keep only the generic SPI flash driver. ESP-IDF otherwise links one
      # driver per vendor (gd, issi, mxic, winbond, boya, th) and uses just the
      # one matching the flash ID, so the rest are idle: ~1KB IRAM on the ESP32,
      # ~2-3KB on the ESP32-S3, plus 124B DRAM each. Safe here because every
      # board runs flash in dio mode, where the generic driver handles any chip;
      # the vendor drivers only matter for qio/qout or flash above 16MB.
      flash_chip: generic
      minimum_chip_revision: "3.1"
    sdkconfig_options:
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

logger:
  # Compiled with DEBUG so the "Log Level" select can raise it at runtime;
  # starts at INFO on every boot.
  level: DEBUG
  initial_level: INFO

api:
  # Don't reboot when no Home Assistant client is connected: players used
  # only with Music Assistant (Sendspin) never have one.
  reboot_timeout: 0s

ota:
  platform: esphome
  password: ${ota_password}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

psram:
  speed: 80MHz

network:
  enable_ipv6: true

# ===== Packages =====
packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esparagus-media-center
    ref: main
    files:
      - firmware/esphome/packages/audio.yaml
      - firmware/esphome/packages/media-player.yaml
      - firmware/esphome/packages/media-player-addon-dac-enable.yaml

      - firmware/esphome/packages/dac-switch.yaml
      - firmware/esphome/packages/light.yaml
      - firmware/esphome/packages/ir-receiver.yaml
      - firmware/esphome/packages/rotary-encoder.yaml
      - firmware/esphome/packages/monitoring.yaml
      - firmware/esphome/packages/monitoring-wifi.yaml

      # Optional ethernet (replace wifi config if you use this, you need to exclude the TFT package if you do this to free up SPI bus)
      # - firmware/esphome/packages/ethernet-w5500.yaml
      # Optional display configuration for TFT SPI display
      # - firmware/esphome/packages/tft-spi.yaml
