display:
  - platform: mipi_spi
    model: ${display_model}
    color_order: RGB
    invert_colors: true
    id: s3_box_lcd
    spi_id: spi_bus_display
    cs_pin: ${display_cs_pin}
    dc_pin: ${display_dc_pin}
    reset_pin: ${display_reset_pin}
    # These two set how much time the ESP32 is running the display
    # which takes time away from playing audio!
    data_rate: 10MHz # T_cycle min is 100ns
    auto_clear_enabled: false
    update_interval: never

# We're caching pixel lengths of strings here, as it's unclear
# how expensive those string calculations are every screen raster
globals:
  - id: title_length
    type: int
    restore_value: no
    initial_value: '0'
  - id: artist_length
    type: int
    restore_value: no
    initial_value: '0'
  - id: album_length
    type: int
    restore_value: no
    initial_value: '0'
  - id: progress_length
    type: int
    restore_value: no
    initial_value: '0'
  # Color constants for weather display
  - id: sun_color
    type: int
    restore_value: no
    initial_value: '0xFFFF00'  # Yellow
  - id: water_color
    type: int
    restore_value: no
    initial_value: '0x00BFFF'  # DeepSkyBlue
  - id: greenish_color
    type: int
    restore_value: no
    initial_value: '0x90EE90'  # LightGreen
  - id: night_color
    type: int
    restore_value: no
    initial_value: '0x2E2EFF'  # DarkBlue
  - id: sunset_color
    type: int
    restore_value: no
    initial_value: '0xFFA500'  # Orange
  - id: aux_text_color
    type: int
    restore_value: no
    initial_value: '0xAAAAAA'  # Light gray

