# ============================================================
# TFT display - Shows simple clock using the SH1106 128x64 OLED connected via SPI
# ============================================================
# Requires substitutions:
#   - spi_clk_pin
#   - spi_mosi_pin
#   - spi_miso_pin
#   - display_cs_pin
#   - display_dc_pin
#   - display_reset_pin
# ============================================================

defaults:
  font_small: 24
  font_family: Roboto
  font_glyphsets: "GF_Latin_Core"
  
substitutions:
  mdi_pause_glyph: \U000F03E4
  mdi_play_glyph: \U000F040A
  mdi_skip_previous_glyph: \U000F04AE
  mdi_skip_next_glyph: \U000F04AD

  # Time to wait before verifying optimistic state changes match actual state
  optimistic_state_correction_delay: 1000ms

  display_rotation: 0
  display_model: ILI9341
  display_invert_colors: false

external_components:
  # - source: github://esphome/esphome@dev
  - source: github://pr#17937
    components: [ runtime_image , sendspin ]
    refresh: 1h

media_player:
  - id: !extend sendspin_group_media_player

    on_play:
      # Update play/pause icon
      # - lambda: lv_label_set_text(id(play_pause_icon), "${mdi_pause_glyph}");
      - if:
          condition:
            lvgl.page.is_showing: idle_page
          then:
            - lvgl.page.show: 
                id: sendspin_page
                animation: FADE_IN
                time: 300ms
    # on_pause:
    #   # Update play/pause icon
    #   - lambda: lv_label_set_text(id(play_pause_icon), "${mdi_play_glyph}");
      
    on_idle:
      # Update play/pause icon
      # - lambda: lv_label_set_text(id(play_pause_icon), "${mdi_play_glyph}");
      - if:
          condition:
            not:
              lvgl.page.is_showing: idle_page
          then:
            - lvgl.page.show: 
                id: idle_page
                animation: FADE_OUT
                time: 300ms

text_sensor:
  - platform: sendspin
    id: track_title
    type: title
    on_value:
      - lambda: |-
          lv_label_set_text(id(track_progress_label), "");
      - component.update: now_playing_text
  - platform: sendspin
    id: album_title
    type: album
  - platform: sendspin
    id: track_artist
    type: artist
    on_value:
      - component.update: now_playing_text
  # - platform: sendspin
  #   id: album_year
  #   type: year
  # - platform: sendspin
  #   id: track_number
  #   type: track
  - platform: template
    id: now_playing_text
    lambda: |-
      std::string playing_text = id(track_title).get_state();
      if (!id(track_artist).get_state().empty()) {
        if (!playing_text.empty()) {
          playing_text += " - ";
        }
        playing_text += id(track_artist).get_state();
      }
      return playing_text;
    on_value:
      - lvgl.label.update: 
          id: now_playing_label
          text: !lambda return x;
    update_interval: never

sensor:
  - platform: sendspin
    type: track_duration
    id: ss_track_duration
    on_value:
      # If the duration has changed, reset the progress bar length
      - globals.set: 
          id: progress_length
          value: '0'

  - platform: sendspin
    type: track_progress
    id: ss_track_progress
    on_value:
      # Do the calculation on the pixel size of the progress bar, having
      # made sure there's a duration to compare against, and it's not too
      # large.  Can't check it's just the wrong one.
      - globals.set: 
          id: progress_length
          value: !lambda |-
            if (x > id(ss_track_duration).state) {
              return 0;
            } else if (id(ss_track_duration).state > 0.0) {
              uint32_t tmp = floor(x);
              tmp *= 128;
              return int(tmp/id(ss_track_duration).state);
            } else {
              return 0;
            }

output:
  - platform: ledc
    pin: ${display_backlight_pin}
    id: backlight_output

light:
  - platform: monochromatic
    id: led
    name: Screen
    icon: "mdi:television"
    entity_category: config
    output: backlight_output
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

  # - platform: template
  #   name: "Screen"
  #   id: switch_screen
  #   optimistic: true
  #   restore_mode: ALWAYS_ON
  #   turn_on_action:
  #     - if:
  #         condition:
  #           api.connected:
  #         then:
  #           - if:
  #               condition:
  #                 media_player.is_idle: sendspin_group_media_player
  #               then:
  #                 - display.page.show: page_clock
  #               else:
  #                 - display.page.show: page_play
  #           - component.update: spi_display
  #   turn_off_action:
  #     - display.page.show: page_off
  #     - component.update: spi_display

time:
  - platform: homeassistant
    id: sntp_time

interval:
  # - interval: 0.5s
  #   then:
  #     - if:
  #         condition:
  #           - media_player.is_playing: sendspin_group_media_player
  #         then:
  #           # - sendspin.get_track_progress:
  #           #     then:
  #           - lambda: |-
  #               uint32_t seconds = x / 1000;
  #               uint32_t minutes = seconds / 60;
  #               seconds %= 60;
  #               char buf[16];
  #               snprintf(buf, sizeof(buf), "%d:%02d", minutes, seconds);
  #               lv_label_set_text(id(track_progress_label), buf);
                
  - interval: 0.5s
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid()) return;

          // Update hours
          char hours_buf[8];
          snprintf(hours_buf, sizeof(hours_buf), "%d", now.hour);
          lv_label_set_text(id(clock_hours_label), hours_buf);

          // Update minutes
          char minutes_buf[8];
          snprintf(minutes_buf, sizeof(minutes_buf), "%02d", now.minute);
          lv_label_set_text(id(clock_minutes_label), minutes_buf);

          // Update flashing separator (toggles every second)
          if (now.second % 2 == 0) {
            lv_label_set_text(id(clock_separator_label), ".");
          } else {
            lv_label_set_text(id(clock_separator_label), " ");
          }

          // Update small clock on the sendspin page info line
          char info_clock_buf[8];
          snprintf(info_clock_buf, sizeof(info_clock_buf), "%02d:%02d", now.hour, now.minute);
          lv_label_set_text(id(info_clock_label), info_clock_buf);

          // Rainbow color cycling based on current timestamp
          auto colorFunc = [](int seq) -> int {
            seq = seq % 0xff;
            if (seq < 85)
              return seq * 3;
            else if (seq < 170)
              return 255 - (seq - 85) * 3;
            return 0;
          };
          auto seq = now.timestamp;
          auto r = colorFunc(seq), g = colorFunc(seq + 85), b = colorFunc(seq + 170);
          auto textColor = lv_color_make(r, g, b);

          lv_obj_set_style_text_color(id(clock_hours_label), textColor, 0);
          lv_obj_set_style_text_color(id(clock_separator_label), textColor, 0);
          lv_obj_set_style_text_color(id(clock_minutes_label), textColor, 0);

          // Weather icon map
          static std::map<std::string, std::pair<std::string, int>> weather_icon_map = {
            {"cloudy", {"\U000F0590", id(sun_color)}},
            {"cloudy-alert", {"\U000F0F2F", id(water_color)}},
            {"cloudy-arrow-right", {"\U000F0E6E", id(water_color)}},
            {"fog", {"\U000F0591", 0xFFFFFF}},
            {"hail", {"\U000F0592", 0xFFFFFF}},
            {"hazy", {"\U000F0F30", 0xFFFFFF}},
            {"hurricane", {"\U000F0898", id(water_color)}},
            {"lightning", {"\U000F0593", 0xFFFFFF}},
            {"lightning-rainy", {"\U000F067E", 0xFFFFFF}},
            {"night", {"\U000F0594", id(night_color)}},
            {"night-partly-cloudy", {"\U000F0F31", id(night_color)}},
            {"partlycloudy", {"\U000F0595", id(sun_color)}},
            {"partly-lightning", {"\U000F0F32", id(water_color)}},
            {"partly-rainy", {"\U000F0F33", id(water_color)}},
            {"partly-snowy", {"\U000F0F34", id(greenish_color)}},
            {"partly-snowy-rainy", {"\U000F0F35", id(greenish_color)}},
            {"pouring", {"\U000F0596", id(water_color)}},
            {"rainy", {"\U000F0597", id(water_color)}},
            {"snowy", {"\U000F0598", id(greenish_color)}},
            {"snowy-heavy", {"\U000F0F36", id(greenish_color)}},
            {"snowy-rainy", {"\U000F067F", id(greenish_color)}},
            {"sunny", {"\U000F0599", id(sun_color)}},
            {"sunny-alert", {"\U000F0F37", id(sun_color)}},
            {"sunny-off", {"\U000F14E4", id(sun_color)}},
            {"sunset", {"\U000F059A", id(sunset_color)}},
            {"sunset-down", {"\U000F059B", id(sunset_color)}},
            {"sunset-up", {"\U000F059C", id(sunset_color)}},
            {"tornado", {"\U000F0F38", id(greenish_color)}},
            {"windy", {"\U000F059D", id(greenish_color)}},
            {"windy-variant", {"\U000F059E", id(greenish_color)}},
          };

          // --- Weather display update ---
          if (id(weather).has_state()) {
            std::string weather_state = id(weather).get_state();
            auto it = weather_icon_map.find(weather_state);
            if (it != weather_icon_map.end()) {
              lv_label_set_text(id(weather_icon_label), it->second.first.c_str());
              lv_obj_set_style_text_color(id(weather_icon_label), lv_color_hex(it->second.second), 0);
              // Also update the small info line icon on the sendspin page
              lv_label_set_text(id(info_weather_icon_label), it->second.first.c_str());
              lv_obj_set_style_text_color(id(info_weather_icon_label), lv_color_hex(it->second.second), 0);
            }
          }
          if (id(temperature).has_state()) {
            char temp_buf[8];
            snprintf(temp_buf, sizeof(temp_buf), "%d", int(id(temperature).state));
            lv_label_set_text(id(temperature_label), temp_buf);
            // Also update the small info line temperature on the sendspin page
            lv_label_set_text(id(info_temperature_label), temp_buf);
          }
          if (id(temperature_unit).has_state()) {
            lv_label_set_text(id(temp_unit_label), id(temperature_unit).get_state().c_str());
            lv_label_set_text(id(info_temp_unit_label), id(temperature_unit).get_state().c_str());
          }

          // --- 4-day forecast update ---
          if (id(forecast_1d_weather).has_state()) {
            auto date_temp = now;
            date_temp.increment_day();
            char date_buf[16];
            snprintf(date_buf, sizeof(date_buf), "%02d/%02d", date_temp.day_of_month, date_temp.month + 1);
            lv_label_set_text(id(forecast_1d_date_label), date_buf);

            std::string f1_weather = id(forecast_1d_weather).get_state();
            auto f1_it = weather_icon_map.find(f1_weather);
            if (f1_it != weather_icon_map.end()) {
              lv_label_set_text(id(forecast_1d_icon_label), f1_it->second.first.c_str());
              lv_obj_set_style_text_color(id(forecast_1d_icon_label), lv_color_hex(f1_it->second.second), 0);
            }
            if (id(forecast_1d_temperature_low).has_state() && id(forecast_1d_temperature_high).has_state()) {
              char temp_buf[32];
              snprintf(temp_buf, sizeof(temp_buf), "%d..%d%s", int(id(forecast_1d_temperature_low).state), int(id(forecast_1d_temperature_high).state), id(temperature_unit).get_state().c_str());
              lv_label_set_text(id(forecast_1d_temp_label), temp_buf);
            }
            if (id(forecast_1d_precipitation).has_state()) {
              char precip_buf[16];
              snprintf(precip_buf, sizeof(precip_buf), "%d%%", int(id(forecast_1d_precipitation).state));
              lv_label_set_text(id(forecast_1d_precip_label), precip_buf);
            }
          }

          if (id(forecast_2d_weather).has_state()) {
            auto date_temp = now;
            date_temp.increment_day();
            date_temp.increment_day();
            char date_buf[16];
            snprintf(date_buf, sizeof(date_buf), "%02d/%02d", date_temp.day_of_month, date_temp.month + 1);
            lv_label_set_text(id(forecast_2d_date_label), date_buf);

            std::string f2_weather = id(forecast_2d_weather).get_state();
            auto f2_it = weather_icon_map.find(f2_weather);
            if (f2_it != weather_icon_map.end()) {
              lv_label_set_text(id(forecast_2d_icon_label), f2_it->second.first.c_str());
              lv_obj_set_style_text_color(id(forecast_2d_icon_label), lv_color_hex(f2_it->second.second), 0);
            }
            if (id(forecast_2d_temperature_low).has_state() && id(forecast_2d_temperature_high).has_state()) {
              char temp_buf[32];
              snprintf(temp_buf, sizeof(temp_buf), "%d..%d%s", int(id(forecast_2d_temperature_low).state), int(id(forecast_2d_temperature_high).state), id(temperature_unit).get_state().c_str());
              lv_label_set_text(id(forecast_2d_temp_label), temp_buf);
            }
            if (id(forecast_2d_precipitation).has_state()) {
              char precip_buf[16];
              snprintf(precip_buf, sizeof(precip_buf), "%d%%", int(id(forecast_2d_precipitation).state));
              lv_label_set_text(id(forecast_2d_precip_label), precip_buf);
            }
          }

          if (id(forecast_3d_weather).has_state()) {
            auto date_temp = now;
            date_temp.increment_day();
            date_temp.increment_day();
            date_temp.increment_day();
            char date_buf[16];
            snprintf(date_buf, sizeof(date_buf), "%02d/%02d", date_temp.day_of_month, date_temp.month + 1);
            lv_label_set_text(id(forecast_3d_date_label), date_buf);

            std::string f3_weather = id(forecast_3d_weather).get_state();
            auto f3_it = weather_icon_map.find(f3_weather);
            if (f3_it != weather_icon_map.end()) {
              lv_label_set_text(id(forecast_3d_icon_label), f3_it->second.first.c_str());
              lv_obj_set_style_text_color(id(forecast_3d_icon_label), lv_color_hex(f3_it->second.second), 0);
            }
            if (id(forecast_3d_temperature_low).has_state() && id(forecast_3d_temperature_high).has_state()) {
              char temp_buf[32];
              snprintf(temp_buf, sizeof(temp_buf), "%d..%d%s", int(id(forecast_3d_temperature_low).state), int(id(forecast_3d_temperature_high).state), id(temperature_unit).get_state().c_str());
              lv_label_set_text(id(forecast_3d_temp_label), temp_buf);
            }
            if (id(forecast_3d_precipitation).has_state()) {
              char precip_buf[16];
              snprintf(precip_buf, sizeof(precip_buf), "%d%%", int(id(forecast_3d_precipitation).state));
              lv_label_set_text(id(forecast_3d_precip_label), precip_buf);
            }
          }

          if (id(forecast_4d_weather).has_state()) {
            auto date_temp = now;
            date_temp.increment_day();
            date_temp.increment_day();
            date_temp.increment_day();
            date_temp.increment_day();
            char date_buf[16];
            snprintf(date_buf, sizeof(date_buf), "%02d/%02d", date_temp.day_of_month, date_temp.month + 1);
            lv_label_set_text(id(forecast_4d_date_label), date_buf);

            std::string f4_weather = id(forecast_4d_weather).get_state();
            auto f4_it = weather_icon_map.find(f4_weather);
            if (f4_it != weather_icon_map.end()) {
              lv_label_set_text(id(forecast_4d_icon_label), f4_it->second.first.c_str());
              lv_obj_set_style_text_color(id(forecast_4d_icon_label), lv_color_hex(f4_it->second.second), 0);
            }
            if (id(forecast_4d_temperature_low).has_state() && id(forecast_4d_temperature_high).has_state()) {
              char temp_buf[32];
              snprintf(temp_buf, sizeof(temp_buf), "%d..%d%s", int(id(forecast_4d_temperature_low).state), int(id(forecast_4d_temperature_high).state), id(temperature_unit).get_state().c_str());
              lv_label_set_text(id(forecast_4d_temp_label), temp_buf);
            }
            if (id(forecast_4d_precipitation).has_state()) {
              char precip_buf[16];
              snprintf(precip_buf, sizeof(precip_buf), "%d%%", int(id(forecast_4d_precipitation).state));
              lv_label_set_text(id(forecast_4d_precip_label), precip_buf);
            }
          }

