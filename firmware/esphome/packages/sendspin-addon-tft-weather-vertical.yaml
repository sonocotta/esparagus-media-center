spi:
  clk_pin: ${spi_clk_pin}
  mosi_pin: ${spi_mosi_pin}
  miso_pin: ${spi_miso_pin}
  id: spi_bus_display

image:
  - platform: sendspin
    id: sendspin_cover_art
    format: JPEG
    type: RGB565
    resize: 240x240
    source: ALBUM
    current_image:
      id: cover_art
    transition_image:
      id: cover_art_transition
    on_image_display:
      - logger.log:
          format: "Album art displayed (late by %u ms)"
          args: ["(unsigned) lateness_ms"]
      # Stand in for a display transition. With a transition image, every display must end
      # with transition_finished so the next frame is released.
      - delay: 300ms
      - sendspin.image.transition_finished: sendspin_cover_art
      - if:
          condition:
            lvgl.page.is_showing: sendspin_page
          then:
            # Built-in lvgl.image.update action doesn't support fading
            # Update image and fade in after decoding
            - lambda: |-
                lv_obj_t* img = id(album_art_widget);
                // Update image source
                lv_img_set_src(img, id(cover_art));
                lv_img_set_zoom(img, LV_ZOOM_NONE);
                // Fade in new image
                static lv_anim_t fade_in;
                lv_anim_init(&fade_in);
                lv_anim_set_var(&fade_in, img);
                lv_anim_set_values(&fade_in, 0, 255);
                lv_anim_set_time(&fade_in, 300);  // 300ms fade in
                lv_anim_set_exec_cb(&fade_in, [](void* obj, int32_t v) {
                    lv_obj_set_style_img_opa((lv_obj_t*)obj, v, 0);
                });
                lv_anim_start(&fade_in);
          else:
            # Page isn't currently open, don't bother fading
            - lvgl.image.update: 
                id: album_art_widget
                src: cover_art
    on_image_error:
      - logger.log: "Failed to decode cover art image"

