script:
  # Called by sendspin-display.yaml after a rotation change
  - id: idle_apply_layout
    parameters:
      landscape: bool
    then:
      - lambda: |-
          // Current weather along the top
          const int icon_x = landscape ? -80 : -72;
          const int unit_x = landscape ? 70 : 62;
          const int top_y = landscape ? -5 : 8;
          lv_obj_align(id(weather_icon_label), LV_ALIGN_TOP_MID, icon_x, top_y);
          lv_obj_align(id(temperature_label), LV_ALIGN_TOP_MID, 0, top_y);
          lv_obj_align(id(temp_unit_label), LV_ALIGN_TOP_MID, unit_x, top_y);

          // Clock in the middle
          const int clock_y = landscape ? -15 : -30;
          lv_obj_align(id(clock_hours_label), LV_ALIGN_CENTER, -60, clock_y);
          lv_obj_align(id(clock_separator_label), LV_ALIGN_CENTER, 0, clock_y);
          lv_obj_align(id(clock_minutes_label), LV_ALIGN_CENTER, 60, clock_y);

          // Four forecast columns along the bottom: 80 px apart, or 60 px in 240 px width
          const int spacing = landscape ? 80 : 60;
          const int bottom = landscape ? 0 : -6;
          lv_obj_t *days[4][4] = {
              {id(forecast_1d_date_label), id(forecast_1d_icon_label), id(forecast_1d_temp_label), id(forecast_1d_precip_label)},
              {id(forecast_2d_date_label), id(forecast_2d_icon_label), id(forecast_2d_temp_label), id(forecast_2d_precip_label)},
              {id(forecast_3d_date_label), id(forecast_3d_icon_label), id(forecast_3d_temp_label), id(forecast_3d_precip_label)},
              {id(forecast_4d_date_label), id(forecast_4d_icon_label), id(forecast_4d_temp_label), id(forecast_4d_precip_label)},
          };
          const int row_y[4] = {-80, -40, -20, 0};
          for (int d = 0; d < 4; d++) {
            const int x = (2 * d - 3) * spacing / 2;
            for (int r = 0; r < 4; r++)
              lv_obj_align(days[d][r], LV_ALIGN_BOTTOM_MID, x, row_y[r] + bottom);
          }

lvgl:
  pages:
    - id: idle_page
      bg_color: 0x000000
      widgets:
        - label:
            id: weather_icon_label
            align: TOP_MID
            x: -80
            y: -5
            text_color: 0xFFFFFF
            text_font: weather_icons_large
            text: ""
        - label:
            id: temperature_label
            align: TOP_MID
            x: 0
            y: -5
            text_color: 0xFFFFFF
            text_font: weather_font_thick
            text: ""
        - label:
            id: temp_unit_label
            align: TOP_MID
            x: 70
            y: -5
            text_color: 0xFFFFFF
