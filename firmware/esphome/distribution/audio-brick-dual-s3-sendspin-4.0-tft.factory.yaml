# ============================================================
# Audio-Brick-Dual-S3 (4.0, Sendspin) - Factory / shippable firmware, TFT screen
# ============================================================
# Screen-enabled sibling of audio-brick-dual-s3-sendspin-4.0.factory.yaml: the very same image
# plus the sendspin-addon-tft.yaml display package, for
# boards that have a TFT screen connected. The plain image ships
# without a display because driving one with nothing connected
# just burns CPU/RAM that audio needs.
#
# Published as its own build (own project name + OTA manifest) so
# screen-less units never auto-update into the display build or
# vice versa.
#
# `version` is substituted by CI at build time (see
# .github/workflows/build-esphome-factory-firmware.yml); "dev" is
# only used for local/manual compiles.
# ============================================================

substitutions:
  version: dev

packages:
  audio-brick-dual-s3-sendspin-4.0-factory: !include audio-brick-dual-s3-sendspin-4.0.factory.yaml
  display_remote:
    url: https://github.com/sonocotta/esparagus-media-center
    ref: main
    files:
      - firmware/esphome/packages/sendspin-addon-tft.yaml

esphome:
  project:
    name: sonocotta.audio-brick-dual-s3-40-sendspin-tft

update:
  - id: !extend update_http_request
    source: https://sonocotta.github.io/esparagus-media-center/artifacts/ota-manifest-audio-brick-dual-s3-4.0-sendspin-tft-latest.json
