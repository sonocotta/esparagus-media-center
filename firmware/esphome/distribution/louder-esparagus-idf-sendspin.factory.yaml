# ============================================================
# Louder-Esparagus (Sendspin) - Factory / shippable firmware, Wi-Fi
# ============================================================
# Layers the "shippable product" concerns on top of the plain
# device config (louder-esparagus-idf-sendspin.yaml, in this same
# directory): pull-based OTA updates, an Improv Wi-Fi onboarding
# flow, and a project identity used by the update entity + the
# ESPHome Dashboard "adopt" flow.
#
# This is the Wi-Fi image. The Ethernet image is its sibling,
# louder-esparagus-idf-sendspin-eth.factory.yaml - a separate
# build because Sendspin over a dual Wi-Fi+Ethernet stack proved
# unreliable, so each image ships exactly one interface and only
# ever auto-updates to its own kind.
#
# `version` is substituted by CI at build time (see
# .github/workflows/build-esphome-factory-firmware.yml); "dev" is
# only used for local/manual compiles.
# ============================================================

substitutions:
  version: dev
  # BLE advertising name used during Improv onboarding.
  improv_ble_name: louder-espa

packages:
  louder-esparagus-idf-sendspin: !include louder-esparagus-idf-sendspin.yaml
  factory_onboarding: !include _factory-onboarding-improv.yaml
  monitoring_wifi_remote:
    url: https://github.com/sonocotta/esparagus-media-center
    ref: main
    files:
      - firmware/esphome/packages/monitoring-wifi.yaml

esphome:
  name_add_mac_suffix: true
  project:
    name: sonocotta.louder-esparagus-sendspin
    version: "${version}"

ota:
  - platform: http_request
    id: ota_http_request

update:
  - platform: http_request
    name: Firmware Update
    id: update_http_request
    source: https://sonocotta.github.io/esparagus-media-center/artifacts/ota-manifest-louder-esparagus-sendspin-latest.json
    update_interval: 6h

# Lets anyone running their own ESPHome Dashboard "adopt" this device
# from the real (non-factory) config that actually matches its hardware.
dashboard_import:
  package_import_url: github://sonocotta/esparagus-media-center/firmware/esphome/3-louder-esparagus/louder-esparagus-idf-sendspin.yaml@main
  import_full_config: false
