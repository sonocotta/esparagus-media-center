# ============================================================
# Amped-Esparagus-Plus-S3 (Sendspin) - Factory / shippable firmware, TFT screen
# ============================================================
# Screen-enabled sibling of amped-esparagus-plus-s3-sendspin.factory.yaml: the very same image
# plus the sendspin-addon-tft-weather-vertical.yaml display package (and
# the weather-sensors.yaml it reads from), for
# boards that have a TFT screen connected. The plain image ships
# without a display because driving one with nothing connected
# just burns CPU/RAM that audio needs.
#
# Published as its own build (own project name + OTA manifest) so
# screen-less units never auto-update into the display build or
# vice versa.
#
# `version` is substituted by CI at build time (see
# .github/workflows/build-esphome-factory-firmware.yml); "dev" is
# only used for local/manual compiles.
# ============================================================

substitutions:
  version: dev

packages:
  amped-esparagus-plus-s3-sendspin-factory: !include amped-esparagus-plus-s3-sendspin.factory.yaml
  display_remote:
    url: https://github.com/sonocotta/esparagus-media-center
    ref: main
    files:
      - firmware/esphome/packages/weather-sensors.yaml
      - firmware/esphome/packages/sendspin-addon-tft-weather-vertical.yaml

esphome:
  project:
    name: sonocotta.amped-esparagus-plus-s3-sendspin-tft

update:
  - id: !extend update_http_request
    source: https://sonocotta.github.io/esparagus-media-center/artifacts/ota-manifest-amped-esparagus-plus-s3-sendspin-tft-latest.json
