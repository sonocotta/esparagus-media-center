# ============================================================
# Amped-Esparagus - Sendspin Configuration (Factory-shippable copy)
# ============================================================
# ESP32 audio board with PCM5100 DAC (I2S) and TPA3128 AMP (rev J->K)
# Configured with Sendspin for synchronized multi-room audio
#
# This is a factory-shippable copy of
# ../4-amped-esapragus/amped-esparagus-idf-j-sendspin.yaml, kept in
# sync by hand. It differs from the dev config in the ways a binary
# that ships to strangers must:
#   - No `!secret` Wi-Fi credentials or OTA password baked in (those
#     only exist on the developer's own machine) — Wi-Fi is instead
#     provisioned per-unit via Improv (see the sibling .factory.yaml).
#   - `esphome.ota` is provided by the .factory.yaml overlay
#     (platform: http_request) instead of platform: esphome.
# Board-specific pinouts defined in substitutions
# Functional blocks imported from /packages
# ============================================================

substitutions:
  name: amped-esparagus-j
  friendly_name: Amped-Esparagus
  task_stack_in_psram: "false"

  # ===== Board-Specific Pinouts =====
  # I2S Audio (PCM5100 DAC)
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26
  i2s_dout_pin: GPIO22

  # DAC Enable Pin
  dac_enable_pin: GPIO13
  dac_enable_restore_mode: ALWAYS_OFF

  # RGB LED
  rgb_led_pin: GPIO12
  num_leds: 8

  # IR Receiver
  ir_rx_pin: GPIO39

  # Rotary Encoder
  rotary_pin_a: GPIO33
  rotary_pin_b: GPIO27
  rotary_btn_pin: GPIO34

  # SPI pins (for display and ethernet)
  spi_clk_pin: GPIO18
  spi_mosi_pin: GPIO23
  spi_miso_pin: GPIO19

  # Ethernet (W5500)
  eth_cs_pin: GPIO05
  eth_interrupt_pin: GPIO35
  eth_reset_pin: GPIO14

  # OLED (SPI)
  display_cs_pin: GPIO15
  display_dc_pin: GPIO04
  display_reset_pin: GPIO32

  # ESP32 optimal settings for Sendspin
  media_source_buffer_size: 100000

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.5.0
  platformio_options:
    board_build.flash_mode: dio

esp32:
  id: esp32_id
  variant: esp32
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    advanced:
      minimum_chip_revision: "3.1"
    sdkconfig_options:
      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

logger:
  level: DEBUG

api:

# Wi-Fi credentials are never baked in: this image ships with no
# configured network and is provisioned per-unit over Improv
# (BLE + Serial), wired up in the .factory.yaml overlay.
wifi:
  id: wifi_id

psram:
  speed: 80MHz

network:
  enable_ipv6: true

# ===== Packages =====
packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esparagus-media-center
    ref: main
    files:
      - firmware/esphome/packages/audio.yaml
      - firmware/esphome/packages/sendspin.yaml
      - firmware/esphome/packages/sendspin-addon-dac-enable.yaml
      # Optional : OLED displays clock when idling, and track/artist info when playing
      # - firmware/esphome/packages/sendspin-addon-oled.yaml
      - firmware/esphome/packages/sendspin-addon-esp32.yaml

      - firmware/esphome/packages/dac-switch.yaml
      - firmware/esphome/packages/light-x.yaml
      - firmware/esphome/packages/ir-receiver.yaml
      - firmware/esphome/packages/rotary-encoder.yaml
      - firmware/esphome/packages/monitoring.yaml
      - firmware/esphome/packages/monitoring-wifi.yaml
      # Optional ethernet (replace wifi config if you use this, you need to exclude OLED package if you do this to free up SPI bus)
      # - firmware/esphome/packages/ethernet-w5500.yaml
