# ============================================================
# Esparagus-Audio-Brick (ESP32, Sendspin) - Factory / shippable firmware, Wi-Fi
# ============================================================
# Layers the "shippable product" concerns on top of the plain
# device config (audio-brick-idf-sendspin.yaml, in this same
# directory): pull-based OTA updates, an Improv Wi-Fi onboarding
# flow, and a project identity used by the update entity + the
# ESPHome Dashboard "adopt" flow.
#
# This is the Wi-Fi image. The Ethernet image is its sibling,
# audio-brick-idf-sendspin-eth.factory.yaml - a separate build
# because Sendspin over a dual Wi-Fi+Ethernet stack proved
# unreliable on this board, so each image ships exactly one
# interface and only ever auto-updates to its own kind.
#
# `version` is substituted by CI at build time (see
# .github/workflows/build-esphome-factory-firmware.yml); "dev" is
# only used for local/manual compiles.
# ============================================================

substitutions:
  version: dev
  sendspin_firmware_version: "${version}"
  # BLE advertising name used during Improv onboarding.
  improv_ble_name: audio-brick

packages:
  audio-brick-idf-sendspin: !include audio-brick-idf-sendspin.yaml
  factory_onboarding: !include _factory-onboarding-improv.yaml
  monitoring_wifi_remote:
    url: https://github.com/sonocotta/esparagus-media-center
    ref: main
    files:
      - firmware/esphome/packages/monitoring-wifi.yaml

esphome:
  name_add_mac_suffix: true
  project:
    name: sonocotta.audio-brick-sendspin
    version: "${version}"

ota:
  - platform: http_request
    id: ota_http_request

update:
  - platform: http_request
    name: Firmware Update
    id: update_http_request
    source: https://sonocotta.github.io/esparagus-media-center/artifacts/ota-manifest-audio-brick-sendspin-latest.json
    update_interval: 6h

# Lets anyone running their own ESPHome Dashboard "adopt" this device
# from the real (non-factory) config that actually matches its hardware.
dashboard_import:
  package_import_url: github://sonocotta/esparagus-media-center/firmware/esphome/5-audio-brick/audio-brick-idf-sendspin.yaml@main
  import_full_config: false
