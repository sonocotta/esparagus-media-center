name: Build ESPHome Factory Firmware

# Builds the shippable ("factory") ESPHome image(s) that end users
# install and auto-update through GitHub Pages - see
# esphome-factory-firmware-architecture.md for the full design.
#
# Unlike build-esphome-configs.yml (which just sanity-compiles every
# dev config on every push/PR), this workflow produces the actual
# artifacts served from docs/: the ESP Web Tools flash manifest +
# firmware.factory.bin, and the OTA manifest + firmware.ota.bin that
# already-provisioned devices poll for updates. It only runs for
# configs that live under firmware/esphome/distribution/*.factory.yaml,
# one matrix entry per shippable device - add a new board by adding a
# row to the matrix below plus its distribution/*.yaml + *.factory.yaml
# pair and docs/artifacts/templates/esphome/*-template.json pair.
#
# Base images ship with no display configured (driving a display that
# isn't connected wastes CPU/RAM the audio pipeline needs). Boards with
# a screen connector get an extra *-oled / *-tft matrix row: a thin
# <base>-<oled|tft>.factory.yaml that includes the base .factory.yaml,
# adds the display package and overrides the project name + OTA
# manifest, so each image only ever auto-updates to its own kind.
#
# The matrix job only compiles + uploads artifacts (never commits
# directly - a dozen matrix legs racing to push to the same branch via
# git-auto-commit-action would drop or conflict with each other's
# commits); a single `finalize` job downloads every leg's output and
# makes one combined commit, mirroring build-squeezelite-binaries.yml's
# prepare/build*/finalize shape.
#
# On a pull_request the build matrix still compiles every real factory
# config end to end (catching breakage the excluded-from-the-matrix
# distribution/*.yaml would otherwise slip through with, see
# build-esphome-configs.yml), but `finalize` never runs - only a push to
# main writes to docs/artifacts, the GitHub Pages source.

on:
  push:
    branches:
      - main
    paths:
      - 'firmware/esphome/distribution/**'
      - 'firmware/esphome/packages/**'
      - 'docs/artifacts/templates/esphome/**'
      - '.github/workflows/build-esphome-factory-firmware.yml'
  pull_request:
    paths:
      - 'firmware/esphome/distribution/**'
      - 'firmware/esphome/packages/**'
      - 'docs/artifacts/templates/esphome/**'
      - '.github/workflows/build-esphome-factory-firmware.yml'
  workflow_dispatch:

concurrency:
  group: build-esphome-factory-firmware
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.device.slug }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device:
          - slug: hifi-esparagus-sendspin
            config_file: hifi-esparagus-idf-sendspin.factory.yaml
          - slug: loud-esparagus-sendspin
            config_file: loud-esparagus-idf-sendspin.factory.yaml
          - slug: louder-esparagus-sendspin
            config_file: louder-esparagus-idf-sendspin.factory.yaml
          - slug: louder-esparagus-sendspin-oled
            config_file: louder-esparagus-idf-sendspin-oled.factory.yaml
          - slug: louder-esparagus-sendspin-eth
            config_file: louder-esparagus-idf-sendspin-eth.factory.yaml
          - slug: amped-esparagus-sendspin
            config_file: amped-esparagus-idf-sendspin.factory.yaml
          - slug: amped-esparagus-sendspin-oled
            config_file: amped-esparagus-idf-sendspin-oled.factory.yaml
          - slug: amped-esparagus-sendspin-eth
            config_file: amped-esparagus-idf-sendspin-eth.factory.yaml
          - slug: amped-esparagus-j-sendspin
            config_file: amped-esparagus-idf-j-sendspin.factory.yaml
          - slug: amped-esparagus-j-sendspin-oled
            config_file: amped-esparagus-idf-j-sendspin-oled.factory.yaml
          - slug: amped-esparagus-j-sendspin-eth
            config_file: amped-esparagus-idf-j-sendspin-eth.factory.yaml
          - slug: amped-esparagus-m-sendspin
            config_file: amped-esparagus-idf-m-sendspin.factory.yaml
          - slug: amped-esparagus-m-sendspin-tft
            config_file: amped-esparagus-idf-m-sendspin-tft.factory.yaml
          - slug: amped-esparagus-m-sendspin-eth
            config_file: amped-esparagus-idf-m-sendspin-eth.factory.yaml
          - slug: audio-brick-sendspin
            config_file: audio-brick-idf-sendspin.factory.yaml
          - slug: audio-brick-sendspin-oled
            config_file: audio-brick-idf-sendspin-oled.factory.yaml
          - slug: audio-brick-sendspin-eth
            config_file: audio-brick-idf-sendspin-eth.factory.yaml
          - slug: audio-brick-s3-sendspin
            config_file: audio-brick-s3-idf-sendspin.factory.yaml
          - slug: audio-brick-s3-sendspin-oled
            config_file: audio-brick-s3-idf-sendspin-oled.factory.yaml
          - slug: audio-brick-s3-sendspin-eth
            config_file: audio-brick-s3-idf-sendspin-eth.factory.yaml
          - slug: hifi-esparagus-s3-sendspin
            config_file: hifi-esparagus-s3-idf-sendspin.factory.yaml
          - slug: audio-brick-dual-s3-2.1-sendspin
            config_file: audio-brick-dual-s3-sendspin-2.1.factory.yaml
          - slug: audio-brick-dual-s3-2.1-sendspin-tft
            config_file: audio-brick-dual-s3-sendspin-2.1-tft.factory.yaml
          - slug: audio-brick-dual-s3-2.1-sendspin-eth
            config_file: audio-brick-dual-s3-sendspin-2.1-eth.factory.yaml
          - slug: audio-brick-dual-s3-4.0-sendspin
            config_file: audio-brick-dual-s3-sendspin-4.0.factory.yaml
          - slug: audio-brick-dual-s3-4.0-sendspin-tft
            config_file: audio-brick-dual-s3-sendspin-4.0-tft.factory.yaml
          - slug: audio-brick-dual-s3-4.0-sendspin-eth
            config_file: audio-brick-dual-s3-sendspin-4.0-eth.factory.yaml
          - slug: echo-duo-sendspin
            config_file: echo-duo-idf-voice-assist-sendspin.factory.yaml
          - slug: echo-duo-sendspin-eth
            config_file: echo-duo-idf-voice-assist-sendspin-eth.factory.yaml
          - slug: echo-solo-sendspin
            config_file: echo-solo-idf-voice-assist-sendspin.factory.yaml
          - slug: amped-esparagus-plus-s3-sendspin
            config_file: amped-esparagus-plus-s3-sendspin.factory.yaml
          - slug: amped-esparagus-plus-s3-sendspin-tft
            config_file: amped-esparagus-plus-s3-sendspin-tft.factory.yaml
          - slug: amped-esparagus-plus-s3-sendspin-eth
            config_file: amped-esparagus-plus-s3-sendspin-eth.factory.yaml
          - slug: louder-esparagus-plus-s3-sendspin
            config_file: louder-esparagus-plus-s3-sendspin.factory.yaml
          - slug: louder-esparagus-plus-s3-sendspin-tft
            config_file: louder-esparagus-plus-s3-sendspin-tft.factory.yaml
          - slug: louder-esparagus-plus-s3-sendspin-eth
            config_file: louder-esparagus-plus-s3-sendspin-eth.factory.yaml
    env:
      DEVICE_SLUG: ${{ matrix.device.slug }}
      CONFIG_DIR: firmware/esphome/distribution
      CONFIG_FILE: ${{ matrix.device.config_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point this repo's packages at the branch under test
        # The board/factory configs pull firmware/esphome/packages/** back out of
        # this repo over the network (`url:` + `ref: main`), so by default a PR
        # compiles its new configs against the *released* packages on main, and a
        # package change goes untested until after it has merged. Repointing those
        # refs at the branch under test closes that gap. On a push to main BRANCH
        # is "main", so this is a no-op and the shippable image is built from
        # exactly the same inputs as before.
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$BRANCH" = "main" ]; then
            echo "Building main - packages already resolve to main, nothing to do."
            exit 0
          fi
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::notice::PR from fork $HEAD_REPO - leaving packages on main," \
                 "its branch is not fetchable from origin."
            exit 0
          fi

          # Rewrite only the `ref:` that belongs to a package pulled from THIS
          # repo: `n` steps onto the line after a matching `url:`, which is always
          # that package's `ref:`. Deliberately left alone - packages pulled from
          # sibling repos such as sonocotta/esparagus-echo (this branch does not
          # exist there), commented-out package blocks, and the `dashboard_import`
          # package_import_url `...@main` values, which are compiled into the
          # shipped image and must keep pointing at main. `-type f` skips the
          # secrets.yaml symlinks, which `sed -i` would replace with real files,
          # and `-not -path '*/.*'` keeps a local .esphome build cache (cloned
          # copies of these very packages) out of it, so the step behaves the
          # same on a developer's tree as on a clean CI checkout.
          find firmware/esphome -name '*.yaml' -type f -not -path '*/.*' -print0 |
            xargs -0r sed -i \
            "\\|url: https://github.com/${THIS_REPO}\$|{n;s|^\\([[:space:]]*\\)ref: main\$|\\1ref: ${BRANCH}|;}"

          echo "--- package refs now resolving to ---"
          grep -rh -A1 "url: https://github.com/${THIS_REPO}\$" \
            firmware/esphome --include='*.yaml' --exclude-dir='.*' |
            grep -o "ref: .*" | sort | uniq -c || true

      - name: Compute version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          VERSION="$(date -u +%Y.%m.%d)-${SHORT_SHA}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $CONFIG_FILE as version $VERSION ($SHORT_SHA)"

      - name: Stamp version into factory config
        run: |
          sed -i "s/^  version: dev\$/  version: \"${{ steps.version.outputs.version }}\"/" \
            "$CONFIG_DIR/$CONFIG_FILE"
          grep -n "version:" "$CONFIG_DIR/$CONFIG_FILE" | head -5

      - name: Compile factory firmware
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/$CONFIG_DIR:/config" \
            ghcr.io/esphome/esphome:2026.10.0 \
            compile "/config/$CONFIG_FILE"

      - name: Collect build artifacts
        id: collect
        run: |
          set -euo pipefail
          BUILD_DIR=$(find "$CONFIG_DIR/.esphome/build" -maxdepth 1 -mindepth 1 -type d | head -1)

          echo "--- Debug: build output ---"
          find "$BUILD_DIR" -maxdepth 3

          FACTORY_BIN=$(find "$BUILD_DIR" -name firmware.factory.bin | head -1)
          OTA_BIN=$(find "$BUILD_DIR" -name firmware.ota.bin | head -1)
          [ -n "$FACTORY_BIN" ] && [ -n "$OTA_BIN" ] || {
            echo "::error::Could not locate firmware.factory.bin / firmware.ota.bin under $BUILD_DIR"
            exit 1
          }

          OUT_DIR="staging/binaries/esphome/${DEVICE_SLUG}"
          mkdir -p "$OUT_DIR"
          cp "$FACTORY_BIN" "$OUT_DIR/firmware.factory.bin"
          cp "$OTA_BIN" "$OUT_DIR/firmware.ota.bin"

          MD5=$(md5sum "$OUT_DIR/firmware.ota.bin" | cut -d' ' -f1)
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"
          echo "Factory+OTA binaries copied to $OUT_DIR (ota md5=$MD5)"

      - name: Render manifests
        run: |
          set -euo pipefail
          # Deliberately its own subdirectory, not docs/artifacts/templates/
          # directly: build-squeezelite-binaries.yml globs every *.json in
          # its own templates/squeezelite/ subdirectory only these days, but
          # this was scoped defensively from day one to avoid the same class
          # of cross-pipeline clobbering bug that hit ota-manifest-hifi-esparagus-sendspin-latest.json
          # (see git history) before that fix.
          TEMPLATE_DIR=docs/artifacts/templates/esphome
          OUT_DIR=staging

          render() {
            local tpl="$1"
            local outname
            outname=$(basename "${tpl/-template/-latest}")
            jq --arg version "${{ steps.version.outputs.version }}" \
               --arg commitid "${{ steps.version.outputs.short_sha }}" \
               --arg md5 "${{ steps.collect.outputs.md5 }}" \
               '.. |= (if type == "string" then
                    gsub("\\$version"; $version)
                    | gsub("\\$commitid"; $commitid)
                    | gsub("\\$md5"; $md5)
                  else . end)' \
               "$tpl" > "$OUT_DIR/$outname"
            echo "Rendered $OUT_DIR/$outname"
          }

          render "$TEMPLATE_DIR/manifest-${DEVICE_SLUG}-esphome-template.json"
          render "$TEMPLATE_DIR/ota-manifest-${DEVICE_SLUG}-template.json"

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esphome-${{ matrix.device.slug }}
          path: staging/

  finalize:
    name: Publish to docs/artifacts
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all staged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: esphome-*
          path: staging
          merge-multiple: true

      - name: Copy staged output into docs/artifacts
        run: |
          set -euo pipefail
          echo "--- Debug: staged output ---"
          find staging -maxdepth 4
          cp -r staging/binaries docs/artifacts/
          find staging -maxdepth 1 -name "*.json" -exec cp {} docs/artifacts/ \;

      - name: Commit artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build ESPHome factory firmware"
          file_pattern: "docs/artifacts/**"
